# Netlify Production Configuration for Oriens Academy
# Architecture: Netlify Next.js runtime + Supabase Backend + Resend Email

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20.18.0"
  NEXT_TELEMETRY_DISABLED = "1"

# Root language redirect: clean host-level redirect to Turkish default locale
[[redirects]]
  from = "/"
  to = "/tr/"
  status = 302

# Global security & caching headers for static HTML pages and static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term immutable caching for hashed Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
